<!doctype html><html><head><meta charset="utf-8"><title>SMILE · live chart</title>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Nunito:wght@700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="smile.css">
<style>
  html,body{width:460px;height:300px}
  .box{position:absolute;inset:0;background:var(--navy-2);border:2px solid rgba(255,255,255,.14);
    border-radius:18px;overflow:hidden;box-shadow:0 18px 46px rgba(4,10,24,.45);display:flex;flex-direction:column}
  .head{display:flex;align-items:center;justify-content:space-between;padding:11px 18px;
    border-bottom:2px solid rgba(255,255,255,.1)}
  .head .l{display:flex;align-items:center;gap:10px;font-family:var(--display);font-weight:600;font-size:21px}
  .head .l i{width:10px;height:10px;border-radius:50%;background:var(--yellow);animation:pulse2 1.8s infinite}
  .head .l small{color:rgba(255,255,255,.5);font-size:17px}
  .head .r{display:flex;align-items:center;font-variant-numeric:tabular-nums}
  .px{font-weight:800;font-size:23px}
  .chg{font-family:var(--display);font-weight:600;font-size:16px;padding:2px 10px;border-radius:7px;margin-left:9px}
  canvas{flex:1;width:100%}
  .foot{display:flex;justify-content:space-between;padding:7px 18px;font-size:14px;
    font-weight:700;color:rgba(255,255,255,.42)}
</style></head><body>
<div class="box">
  <div class="head">
    <div class="l"><i></i><span id="sym">BTC/USD</span><small>· <span id="tf">1m</span></small></div>
    <div class="r"><span class="px" id="px">—</span><span class="chg" id="chg"></span></div>
  </div>
  <canvas id="cv" width="920" height="400"></canvas>
  <div class="foot"><span>LIVE · BINANCE FEED</span><span>smile.co.ke</span></div>
</div>
<script>
const q=new URLSearchParams(location.search);
const SYM=(q.get('symbol')||'BTCUSDT').toUpperCase(), TF=q.get('interval')||'1m';
document.getElementById('sym').textContent=q.get('label')||SYM.replace('USDT','/USD');
document.getElementById('tf').textContent=TF;
const cv=document.getElementById('cv'),ctx=cv.getContext('2d'),UP='#1FB35F',DN='#FF4757';
function draw(k){
  const w=cv.width,h=cv.height,pad=14;
  const hi=Math.max(...k.map(c=>+c[2])),lo=Math.min(...k.map(c=>+c[3]));
  const Y=v=>pad+(h-2*pad)*(1-(v-lo)/((hi-lo)||1));
  ctx.clearRect(0,0,w,h);
  ctx.strokeStyle='rgba(255,255,255,.07)';ctx.lineWidth=1;
  for(let i=1;i<5;i++){const y=pad+(h-2*pad)*i/5;ctx.beginPath();ctx.moveTo(0,y);ctx.lineTo(w,y);ctx.stroke();}
  const cw=w/k.length;
  k.forEach((c,i)=>{const o=+c[1],cl=+c[3],x=i*cw+cw/2,col=cl>=o?UP:DN;
    ctx.strokeStyle=col;ctx.lineWidth=2;
    ctx.beginPath();ctx.moveTo(x,Y(+c[2]));ctx.lineTo(x,Y(+c[3]));ctx.stroke();
    const bw=Math.max(3,cw*.55);ctx.fillStyle=col;
    ctx.fillRect(x-bw/2,Math.min(Y(o),Y(cl)),bw,Math.max(2,Math.abs(Y(o)-Y(cl))));});
}
async function load(){
  for(const h of ['https://data-api.binance.vision','https://api.binance.com']){
    try{const r=await fetch(`${h}/api/v3/klines?symbol=${SYM}&interval=${TF}&limit=60`);
      if(!r.ok)continue;const k=await r.json();draw(k);
      const c=+k[k.length-1][3],pct=(c-+k[0][1])/+k[0][1]*100;
      document.getElementById('px').textContent=c.toLocaleString('en-US',{maximumFractionDigits:2});
      const el=document.getElementById('chg');
      el.textContent=(pct>=0?'+':'')+pct.toFixed(2)+'%';
      el.style.background=pct>=0?'rgba(31,179,95,.25)':'rgba(255,71,87,.25)';
      el.style.color=pct>=0?'#7CF0B2':'#FFB3BA';return;
    }catch(e){}}
}
load();setInterval(load,10000);
</script>
</body></html>
