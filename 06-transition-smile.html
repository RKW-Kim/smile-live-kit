<!doctype html><html><head><meta charset="utf-8"><title>SMILE · transition wipe</title>
<!-- TIMELINE: 1.5s total · screen fully covered ~600–950ms → CUT scenes at ~750ms -->
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="smile.css">
<style>
  body{pointer-events:none}
  .p{position:absolute;inset:0;transform:translateX(-112%);
    animation:wipe 1.5s cubic-bezier(.83,0,.17,1) both}
  .p.navy{background:var(--navy-2);z-index:2}
  .p.yellow{background:var(--yellow);z-index:3;animation-delay:.09s;
    background-image:radial-gradient(rgba(10,31,60,.13) 3px,transparent 3.5px);background-size:44px 44px}
  @keyframes wipe{0%{transform:translateX(-112%)}42%{transform:translateX(0)}
    72%{transform:translateX(0)}100%{transform:translateX(112%)}}
  .brand{position:absolute;inset:0;display:grid;place-items:center;z-index:4;
    animation:bp 1.5s .09s both}
  .brand .logo{color:var(--navy)} .brand b{font-size:300px}
  .brand svg{width:70%;margin:2% auto 0}
  .brand svg path{stroke-dasharray:240;stroke-dashoffset:0;animation:none}
  @keyframes bp{0%,26%{opacity:0;transform:scale(.5)}38%{opacity:1;transform:scale(1.08)}
    46%{transform:scale(1)}74%{opacity:1}94%,100%{opacity:0}}
</style></head><body>
<div class="stage">
  <div class="p navy"></div>
  <div class="p yellow"></div>
  <div class="brand"><div class="logo"><b>smile</b>
    <svg viewBox="0 0 220 60"><path d="M12 10 C 60 56, 160 56, 208 10"/></svg></div></div>
</div>
</body></html>
