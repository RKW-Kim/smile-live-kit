<!doctype html><html><head><meta charset="utf-8"><title>SMILE · session closed</title>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Nunito:wght@700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="smile.css">
<style>
  .wrap{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:30px;text-align:center}
  h1{font-family:var(--display);font-weight:700;font-size:148px;letter-spacing:-.02em;line-height:.95}
  h1 .y{color:var(--yellow)}
  .arc{width:320px;color:var(--yellow);margin-top:-8px}
  .arc path{fill:none;stroke:currentColor;stroke-width:16;stroke-linecap:round}
  .sub{font-size:28px;font-weight:700;color:rgba(255,255,255,.75);max-width:780px}
  .socials{display:flex;gap:16px;margin-top:10px}
  .next{font-size:26px;margin-top:8px}
  .cf{position:absolute;top:-40px;width:14px;height:24px;border-radius:4px;animation:fall linear infinite}
  @keyframes fall{to{transform:translateY(1180px) rotate(560deg)}}
</style></head><body>
<div class="stage">
  <div class="bg"></div>
  <div id="confetti"></div>
  <div class="wrap">
    <span class="chip ghost">✓ MARKET CLOSED</span>
    <h1>session <span class="y">closed</span>.</h1>
    <svg class="arc" viewBox="0 0 220 60"><path d="M12 10 C 60 56, 160 56, 208 10"/></svg>
    <p class="sub">Asante for trading with us today — books balanced, smile intact. Same desk next time.</p>
    <div class="socials">
      <span class="chip dark">▶ YouTube · /smileke</span>
      <span class="chip dark">◉ Twitch · /smileke</span>
      <span class="chip dark">♪ TikTok · @smileke</span>
    </div>
    <span class="chip solid next">NEXT SESSION · FRIDAY 8PM EAT</span>
  </div>
</div>
<script>
  const cols=['#FFC72C','#3FB6FF','#FF6B4A','#FFFFFF','#1FB35F'], box=document.getElementById('confetti');
  for(let i=0;i<36;i++){const s=document.createElement('span');s.className='cf';
    s.style.left=Math.random()*100+'%'; s.style.background=cols[i%cols.length];
    s.style.animationDuration=(3.5+Math.random()*3)+'s'; s.style.animationDelay=(Math.random()*4)+'s';
    s.style.width=(9+Math.random()*9)+'px'; box.appendChild(s);}
</script>
</body></html>
