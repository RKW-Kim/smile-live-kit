name: Bug Report
description: Report a bug in Smile Live Kit (scene, overlay, console, ticker, brand, or infra)
labels: ["bug", "triage"]
body:
  - type: textarea
    id: description
    attributes:
      label: Description
      description: What happened? What did you expect to happen?
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Reproduction steps
      description: Ordered list — be specific about the route, the channel, and the input.
      placeholder: |
        1. Open http://localhost:3000/scenes/trading-live
        2. Open the control console at /
        3. Switch channel to "news"
        4. Notice the scene's status dot color is still cyan
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: Affected area
      options:
        - Scene route (/scenes/*)
        - Overlay route (/overlays/*)
        - Control console (/)
        - W21 brand / mark
        - Ticker / market data
        - Realtime / transport
        - Docs
        - CI / build / deploy
        - Other
    validations:
      required: true
  - type: dropdown
    id: severity
    attributes:
      label: Severity
      options:
        - Critical (blocks the stream / the console / a launch)
        - High (a scene or panel is broken)
        - Medium (workaround exists)
        - Low (cosmetic)
    validations:
      required: true
  - type: textarea
    id: context
    attributes:
      label: Additional context
      description: Browser, OBS version (if a Browser Source issue), screenshots, console errors, worklog Task ID if known.
