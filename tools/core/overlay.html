<!doctype html><html><head><meta charset="utf-8"><script defer src="https://unpkg.com/alpinejs@3.15.0/dist/cdn.min.js"></script>
<style>
body{margin:0;background:transparent;overflow:hidden;font-family:Inter}
.frame{position:absolute;inset:0;border:3px solid var(--p,#FFD400);border-radius:24px;pointer-events:none}
.label{position:absolute;top:20px;left:20px;background:#0A0A0A;color:#fff;padding:6px 12px;border-radius:8px;font:700 12px Inter;border-left:3px solid var(--p)}
</style></head>
<body x-data="{brand:{colors:{primary:'#FFD400'}}}" x-init="fetch('/api/brand').then(r=>r.json()).then(b=>{brand=b;document.documentElement.style.setProperty('--p',b.colors.primary)})">
<div class="frame"></div>
<div class="label" x-text="$store.brand?.meta?.display || 'SMILE LIVE'"></div>
</body></html>
