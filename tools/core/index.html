<!doctype html><html><head><meta charset="utf-8"><script defer src="https://unpkg.com/alpinejs@3.15.0/dist/cdn.min.js"></script>
<style>body{margin:0;background:#0A0A0A;color:#fff;font-family:Inter;padding:24px}h1{font-size:24px} .grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(340px,1fr));gap:16px;margin-top:16px}.card{background:#151515;border:1px solid #222;border-radius:16px;overflow:hidden}.card header{padding:10px 14px;border-bottom:1px solid #222;display:flex;justify-content:space-between;align-items:center}iframe{width:100%;height:240px;border:0;background:transparent}button{background:#FFD400;color:#000;border:0;padding:8px 12px;border-radius:8px;font-weight:700;cursor:pointer}code{background:#222;padding:2px 6px;border-radius:4px}</style></head>
<body x-data="{health:{}}">
<h1>Smile Live Kit v2 — Control Deck</h1>
<p>Bridge: <code>http://localhost:8787</code> | <span x-text="health.marketOpen?'Market OPEN':'Market CLOSED'"></span> | OBS: <span x-text="health.obsConnected?'connected':'waiting'"></span></p>
<div class="grid">
  <div class="card"><header>Ticker <button @click="fetch('/api/obs/scene',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({scene:'TICKER'})})">Show TICKER</button></header><iframe src="/ticker.html"></iframe></div>
  <div class="card"><header>Lower Third <button @click="fetch('/api/layout/apply',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({scene:'CHART',layout:'CHART'})})">Apply CHART layout (camera auto-place)</button></header><iframe src="/lower-third.html"></iframe></div>
  <div class="card"><header>Chart</header><iframe src="/chart.html"></iframe></div>
  <div class="card"><header>Overlay Frame</header><iframe src="/overlay.html"></iframe></div>
</div>
<script>fetch('/api/health').then(r=>r.json()).then(d=>{document.querySelector('[x-data]')._x_dataStack[0].health=d})</script>
</body></html>
