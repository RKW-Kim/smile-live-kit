<!doctype html><html><head><meta charset="utf-8"><script defer src="https://unpkg.com/alpinejs@3.15.0/dist/cdn.min.js"></script>
<style>:root{--p:#FFD400;--bg:#111}body{margin:0;background:transparent;font-family:Inter;overflow:hidden}.wrap{position:absolute;left:60px;bottom:60px}.lt{background:linear-gradient(90deg,var(--p),#fff0);padding:2px;border-radius:14px;box-shadow:0 20px 60px #0008}.inner{background:var(--bg);border-radius:12px;padding:18px 28px;min-width:420px}.handle{color:var(--p);font:700 13px;letter-spacing:.12em;text-transform:uppercase}.title{color:#fff;font:800 26px/1.1 Inter;margin-top:6px}.sub{color:#aaa;font:500 14px;margin-top:4px}</style></head>
<body x-data="lt()" x-init="init()"><div class="wrap"><div class="lt" x-show="show" x-transition:enter="transition ease-out duration-500" x-transition:enter-start="opacity-0 translate-y-8 scale-95" x-transition:enter-end="opacity-100 translate-y-0 scale-100" x-transition:leave="transition ease-in duration-300" x-transition:leave-end="opacity-0 translate-y-4"><div class="inner"><div class="handle" x-text="data.handle"></div><div class="title" x-text="data.title"></div><div class="sub" x-text="data.subtitle"></div></div></div></div>
<script>function lt(){return{show:false,data:{handle:'@smile.co.ke',title:'NSE LIVE',subtitle:'Market Open'},init(){const ws=new WebSocket(`ws://${location.host}`);ws.onmessage=e=>{const m=JSON.parse(e.data);if(m.type==='lowerthird'){this.data=m.data;this.show=true;setTimeout(()=>this.show=false,m.data.duration||6000)} if(m.type==='brand'){document.documentElement.style.setProperty('--p',m.data.colors.primary)}};setTimeout(()=>this.show=true,600);}}</script>
</body></html>
