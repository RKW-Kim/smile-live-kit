<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=1920, height=1080">
<title>Live Overlay</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
html, body {
  width: 1920px;
  height: 1080px;
  overflow: hidden;
  background: transparent;
  font-family: 'Inter', 'Segoe UI', system-ui, sans-serif;
}

.frame {
  position: absolute;
  border: 2px solid rgba(255, 255, 255, 0.15);
  border-radius: 8px;
  pointer-events: none;
  transition: border-color 0.3s ease;
}
.frame.active {
  border-color: rgba(99, 220, 150, 0.7);
  box-shadow: 0 0 12px rgba(99, 220, 150, 0.2);
}
.frame .label {
  position: absolute;
  bottom: 8px;
  left: 12px;
  font-size: 14px;
  font-weight: 600;
  color: #fff;
  background: rgba(0, 0, 0, 0.6);
  padding: 3px 10px;
  border-radius: 4px;
  opacity: 0;
  transition: opacity 0.3s;
}
.frame.active .label { opacity: 1; }

/* Layout: single */
.layout-single .frame-main { left: 0; top: 0; width: 1920px; height: 1080px; border: none; }

/* Layout: duo */
.layout-duo .frame-left  { left: 0; top: 0; width: 960px; height: 1080px; }
.layout-duo .frame-right { left: 960px; top: 0; width: 960px; height: 1080px; }

/* Layout: grid4 */
.layout-grid4 .frame-tl { left: 0; top: 0; width: 960px; height: 540px; }
.layout-grid4 .frame-tr { left: 960px; top: 0; width: 960px; height: 540px; }
.layout-grid4 .frame-bl { left: 0; top: 540px; width: 960px; height: 540px; }
.layout-grid4 .frame-br { left: 960px; top: 540px; width: 960px; height: 540px; }

/* Layout: autotalk */
.layout-autotalk .frame-main    { left: 0; top: 0; width: 1440px; height: 1080px; }
.layout-autotalk .frame-strip_0 { left: 1440px; top: 0; width: 480px; height: 270px; }
.layout-autotalk .frame-strip_1 { left: 1440px; top: 270px; width: 480px; height: 270px; }
.layout-autotalk .frame-strip_2 { left: 1440px; top: 540px; width: 480px; height: 270px; }
.layout-autotalk .frame-strip_3 { left: 1440px; top: 810px; width: 480px; height: 270px; }

.ticker-zone {
  position: absolute;
  bottom: 0;
  left: 0;
  width: 1920px;
  height: 76px;
  pointer-events: none;
}
</style>
</head>
<body>
<div id="overlay"></div>
<div class="ticker-zone"></div>

<script>
(function() {
  var params = new URLSearchParams(window.location.search);
  var layout = params.get('layout') || 'single';
  var overlay = document.getElementById('overlay');
  overlay.className = 'layout-' + layout;

  var SLOT_NAMES = {
    single: ['main'],
    duo: ['left', 'right'],
    grid4: ['tl', 'tr', 'bl', 'br'],
    autotalk: ['main', 'strip_0', 'strip_1', 'strip_2', 'strip_3'],
  };

  var names = SLOT_NAMES[layout] || SLOT_NAMES.single;
  names.forEach(function(name) {
    var el = document.createElement('div');
    el.className = 'frame frame-' + name;
    el.dataset.slot = name;
    el.innerHTML = '<span class="label"></span>';
    overlay.appendChild(el);
  });

  function connectWS() {
    var wsUrl = 'ws://' + window.location.host + '/api/autotalk/state';
    var ws = new WebSocket(wsUrl);
    ws.onmessage = function(evt) {
      var state = JSON.parse(evt.data);
      document.querySelectorAll('.frame').forEach(function(f) {
        f.classList.remove('active');
        f.querySelector('.label').textContent = '';
      });
      if (state.main) {
        var mainEl = document.querySelector('.frame-' + state.main_slot);
        if (mainEl) {
          mainEl.classList.add('active');
          mainEl.querySelector('.label').textContent = state.main;
        }
      }
      (state.strip || []).forEach(function(s, i) {
        var el = document.querySelector('.frame-strip_' + i);
        if (el) {
          el.classList.add('active');
          el.querySelector('.label').textContent = s;
        }
      });
    };
    ws.onclose = function() { setTimeout(connectWS, 3000); };
    ws.onerror = function() { ws.close(); };
  }

  if (layout === 'autotalk') {
    connectWS();
  }
})();
</script>
</body>
</html>
