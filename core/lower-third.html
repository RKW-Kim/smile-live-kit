<!doctype html><html><head><meta charset="utf-8">
<script defer src="./vendor/alpine.min.js" onerror="var s=document.createElement('script');s.src='https://unpkg.com/alpinejs@3.15.0/dist/cdn.min.js';document.head.appendChild(s)"></script>
<style>
:root{--p:#FFD400;--bg:#111}body{margin:0;background:transparent;font-family:Inter;overflow:hidden}
.wrap{position:absolute;left:60px;bottom:60px}
.lt{background:linear-gradient(90deg,var(--p),#fff0);padding:2px;border-radius:14px;box-shadow:0 20px 60px #0008}
.inner{background:var(--bg);border-radius:12px;padding:18px 28px;min-width:420px;display:flex;gap:16px;align-items:center}
.mark{width:48px;height:48px;flex-shrink:0} .mark object{width:100%;height:100%}
.handle{color:var(--p);font:700 13px;letter-spacing:.12em;text-transform:uppercase}
.title{color:#fff;font:800 26px/1.1 Inter;margin-top:6px}
</style></head>
<body x-data="lt()" x-init="init()">
<div class="wrap"><div class="lt" x-show="show" x-transition:enter="transition ease-out duration-500" x-transition:enter-start="opacity-0 translate-y-8 scale-95" x-transition:enter-end="opacity-100 translate-y-0 scale-100" x-transition:leave="transition ease-in duration-300" x-transition:leave-end="opacity-0 translate-y-4"><div class="inner"><div class="mark"><object data="./assets/smile-mark.svg" type="image/svg+xml"></object></div><div><div class="handle" x-text="data.handle"></div><div class="title" x-text="data.title"></div><div style="color:#aaa" x-text="data.subtitle"></div></div></div></div></div>
<script>
function loadJSON(path, cb){
  fetch(path).then(r=>r.json()).then(cb).catch(()=>{
    try{ var xhr=new XMLHttpRequest(); xhr.open('GET',path,true); xhr.onload=function(){try{cb(JSON.parse(xhr.responseText))}catch{}}; xhr.send(); }catch{}
  });
}
function lt(){return{show:false,data:{handle:'@smile.co.ke',title:'NSE LIVE',subtitle:'Safaricom +2.3%'},init(){setTimeout(()=>this.show=true,400); loadJSON('./brand.json',(b)=>{ if(b.colors) document.documentElement.style.setProperty('--p',b.colors.primary) })}}}</script>
</body></html>
