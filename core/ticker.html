<!doctype html>
<html><head><meta charset="utf-8">
<script defer src="./vendor/alpine.min.js"></script>
<style>
:root{--p:#FFD400;--bg:#0A0A0A}*{margin:0;padding:0;box-sizing:border-box}
body{background:transparent;font-family:Inter;overflow:hidden}
.ticker{display:flex;white-space:nowrap;animation:scroll 120s linear infinite;background:var(--bg);color:#fff;border-top:3px solid var(--p)}
.item{padding:14px 28px;display:flex;gap:10px;border-right:1px solid #222}
.up{color:#00E676}.down{color:#FF3D57}
@keyframes scroll{0%{transform:translateX(0)}100%{transform:translateX(-50%)}}
</style></head>
<body x-data="ticker()" x-init="init()">
<div id="live" class="ticker">
  <template x-for="s in prices"><div class="item"><strong x-text="s.symbol"></strong><span x-text="s.price"></span><span :class="s.dir" x-text="s.change"></span></div></template>
  <template x-for="s in prices"><div class="item"><strong x-text="s.symbol"></strong><span x-text="s.price"></span><span :class="s.dir" x-text="s.change"></span></div></template>
</div>
<script>
function ticker(){
  return {
    prices:[{symbol:'AAPL',price:214.33,change:'+0.4%',dir:'up'},{symbol:'SCOM',price:14.2,change:'+2.3%',dir:'up'}],
    async init(){
      try{
        const b=await fetch('/api/brand').then(r=>r.json())
        document.documentElement.style.setProperty('--p',b.colors.primary)
      }catch{}
      try{
        const ws=new WebSocket('ws://'+location.host)
        ws.onmessage=e=>{const m=JSON.parse(e.data);if(m.type==='brand')document.documentElement.style.setProperty('--p',m.data.colors.primary)}
      }catch{}
    }
  }
}
</script>
</body></html>
