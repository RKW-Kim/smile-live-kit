<!doctype html>
<html><head><meta charset="utf-8">
<!-- Relative vendor first, CDN fallback -->
<script src="./vendor/htmx.min.js"></script>
<script src="./vendor/htmx-sse.js" onerror="this.onerror=null;this.src='https://unpkg.com/htmx.org@1.12.2/dist/ext/sse.js'"></script>
<script defer src="./vendor/alpine.min.js" onerror="this.onerror=null;this.src='https://unpkg.com/alpinejs@3.15.0/dist/cdn.min.js'"></script>
<style>
:root{--p:#FFD400;--bg:#0A0A0A}*{margin:0;padding:0;box-sizing:border-box}
body{background:transparent;font-family:Inter,system-ui;overflow:hidden}
.ticker{display:flex;white-space:nowrap;animation:scroll 120s linear infinite;background:var(--bg);color:#fff;border-top:3px solid var(--p)}
.item{padding:14px 28px;display:flex;gap:10px;align-items:center;border-right:1px solid #222}
.up{color:#00E676}.down{color:#FF3D57}
@keyframes scroll{0%{transform:translateX(0)}100%{transform:translateX(-50%)}}
</style></head>
<body x-data="ticker()" x-init="init()">
<div id="live" class="ticker">
  <template x-for="s in prices"><div class="item"><strong x-text="s.symbol"></strong><span x-text="Number(s.price).toFixed(2)"></span><span :class="s.dir" x-text="s.change+'%'"></span></div></template>
  <template x-for="s in prices"><div class="item"><strong x-text="s.symbol"></strong><span x-text="Number(s.price).toFixed(2)"></span><span :class="s.dir" x-text="s.change+'%'"></span></div></template>
</div>
<script>
function ticker(){
  return {
    prices:[{symbol:'AAPL',price:214,change:0.4,dir:'up'}],
    async init(){
      const brand = await fetch('./brand.json').then(r=>r.json()).catch(()=>({colors:{primary:'#FFD400',bg:'#0A0A0A'}}))
      document.documentElement.style.setProperty('--p', brand.colors.primary)
      document.documentElement.style.setProperty('--bg', brand.colors.bg)
      // Try live.json (written by live-updater.mjs) — relative file:// fetch works in OBS CEF
      const loadLive = async()=>{
        try{
          const live = await fetch('./live.json?t='+Date.now()).then(r=>r.json())
          if(live.symbols) this.prices = live.symbols
        }catch(e){ /* keep mock */ }
      }
      loadLive()
      setInterval(loadLive, 15000)
    }
  }
}
</script>
</body></html>
