<!doctype html><html><head><meta charset="utf-8"><title>SMILE · alerts</title>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@500;700;800&family=Inter:wght@500;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="smile.css">
<style>
  #zone{position:absolute;left:0;right:0;top:120px;display:flex;flex-direction:column;align-items:center;pointer-events:none}
  .alert{position:relative;display:flex;align-items:center;gap:22px;background:var(--panel);color:#fff;border:2px solid var(--yellow);border-radius:20px;padding:20px 36px 20px 20px;box-shadow:0 24px 60px rgba(0,0,0,.55);opacity:0;transform:translateY(-60px) scale(.8)}
  .alert.show{animation:ain .55s cubic-bezier(.2,1.4,.3,1) forwards}.alert.hide{animation:aout .45s ease forwards}
  @keyframes ain{to{transform:none;opacity:1}}@keyframes aout{to{transform:translateY(-40px) scale(.9);opacity:0}}
  .burst{position:absolute;inset:-46px;border-radius:50%;z-index:-1;filter:blur(1px);opacity:0;background:repeating-conic-gradient(rgba(255,193,7,.5) 0 9deg,transparent 9deg 18deg)}
  .alert.show .burst{animation:burst .8s ease-out forwards}@keyframes burst{0%{opacity:.9;transform:scale(.3)}100%{opacity:0;transform:scale(1.3) rotate(40deg)}}
  .icon{width:84px;height:84px;border-radius:50%;background:var(--yellow);display:grid;place-items:center;flex-shrink:0}
  .icon svg{width:44px;height:44px;stroke:#0b0b0b;fill:none;stroke-width:2.3;stroke-linecap:round;stroke-linejoin:round}
  .k{font-family:var(--display);font-weight:700;font-size:18px;letter-spacing:.16em;text-transform:uppercase;color:var(--yellow)}
  .n{font-family:var(--display);font-weight:800;font-size:42px;line-height:1.05}.m{font-weight:600;font-size:20px;color:var(--muted);margin-top:2px}
  .amt{display:inline-block;background:var(--up);color:#06281c;border-radius:8px;padding:2px 12px;font-family:var(--display);font-weight:700;font-size:17px;margin-left:10px}
  .cfx{position:absolute;left:50%;top:50%;width:10px;height:16px;border-radius:3px;animation:cf .9s ease-out forwards}
  @keyframes cf{to{transform:translate(var(--tx),var(--ty)) rotate(var(--r));opacity:0}}
</style></head><body>
<div id="zone"></div>
<script>
const q=new URLSearchParams(location.search);const hosted=!!(window.SE_API||window.slobs);
const ICONS={follower:'<svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M8.5 10v.5M15.5 10v.5"/><path d="M8 14.5c1.3 1.7 6.7 1.7 8 0"/></svg>',
  sub:'<svg viewBox="0 0 24 24"><path d="M7 3v2M7 15v4"/><rect x="4.5" y="5" width="5" height="10" rx="1.2"/><path d="M17 5v2M17 19v2"/><rect x="14.5" y="7" width="5" height="12" rx="1.2"/></svg>',
  tip:'<svg viewBox="0 0 24 24"><rect x="6.5" y="2.5" width="11" height="19" rx="2.5"/><path d="M10 5.5h4M12 17.5v.5"/></svg>',
  raid:'<svg viewBox="0 0 24 24"><path d="M3 11v2l4 1 2 6 2-1-1.4-4.2L21 17V7L9.6 11.8 3 11z"/></svg>'};
const TITLES={follower:'new trader on the floor!',sub:'premium seat unlocked!',tip:'M-Pesa tip!',raid:'the floor is flooding!'};
const zone=document.getElementById('zone'),queue=[];let busy=false;
function push(kind,name,msg,extra){queue.push({kind,name,msg,extra});if(!busy)next();}
function next(){const a=queue.shift();if(!a){busy=false;return;}busy=true;
  const el=document.createElement('div');el.className='alert';
  el.innerHTML=`<span class="burst"></span><div class="icon">${ICONS[a.kind]||ICONS.follower}</div><div><div class="k">${TITLES[a.kind]||'alert'}</div><div class="n">${a.name}</div><div class="m">${a.msg||''}${a.extra?`<span class="amt">${a.kind==='tip'?'M-PESA · ':''}${a.extra}</span>`:''}</div></div>`;
  const cols=['#FFC107','#0ECB81','#F6465D','#3FB6FF'];
  for(let i=0;i<18;i++){const s=document.createElement('span');s.className='cfx';s.style.background=cols[i%4];s.style.setProperty('--tx',(Math.random()*360-180)+'px');s.style.setProperty('--ty',(Math.random()*260-160)+'px');s.style.setProperty('--r',(Math.random()*540-270)+'deg');el.appendChild(s);}
  zone.appendChild(el);requestAnimationFrame(()=>el.classList.add('show'));
  setTimeout(()=>{el.classList.add('hide');setTimeout(()=>{el.remove();next();},460);},6000);}
window.addEventListener('onEventReceived',e=>{const d=e&&e.detail;if(!d||d.listener!=='event'||!d.event)return;const ev=d.event;
  if(ev.type==='follower')push('follower',ev.name,'just followed — welcome to the desk!');
  else if(ev.type==='subscriber')push('sub',ev.name,`subscribed · tier ${ev.tier||1} — bulls only`);
  else if(ev.type==='tip')push('tip',ev.name,ev.message||'asante sana!',`${ev.currency||'KES'} ${Math.round(ev.amount||0)}`);
  else if(ev.type==='raid')push('raid',ev.name,`brought ${ev.amount||''} traders!`);});
window.addEventListener('onAlert',e=>{const d=e&&e.detail;if(!d)return;
  if(d.type==='follow')push('follower',d.name,'just followed — karibu!');
  else if(d.type==='subscription')push('sub',d.name,d.message||'subscribed — bulls only!');
  else if(d.type==='donation')push('tip',d.name,d.message||'',`${d.currency||'KES'} ${Math.round(d.amount||0)}`);
  else if(d.type==='raid')push('raid',d.name,`brought ${d.amount||''} traders!`);});
if(!hosted&&q.get('demo')!=='0'){const s=[['follower','Wanjiru_K','just followed — welcome to the desk!'],['tip','Otieno_Dev','asante! straight to the war chest','KES 500'],['sub','NjeriPlays','subscribed · tier 1 — bulls only'],['raid','KamauLive','brought 128 traders!']];let i=0;setTimeout(function loop(){push(...s[i++%s.length]);setTimeout(loop,8500);},2000);}
</script></body></html>
