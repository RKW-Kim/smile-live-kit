<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" preserveAspectRatio="xMidYMid meet" width="100" height="100" id="smile-mark">
  <style>
    #mark-group{transform-origin:50px 50px;animation:smilePulse 3s ease-in-out infinite}
    @keyframes smilePulse{0%,100%{transform:scale(1)}25%{transform:scale(1.06)}50%{transform:scale(1)}75%{transform:scale(1.04)}}
  </style>
  <g id="mark-group">
    <circle cx="50" cy="50" r="48" fill="#0A0A0A" stroke="#FFD400" stroke-width="3"/>
    <path d="M 30 60 Q 50 80 70 60" stroke="#FFD400" stroke-width="4" fill="none" stroke-linecap="round"/>
    <circle cx="35" cy="40" r="6" fill="#FFD400"/>
    <circle cx="65" cy="40" r="6" fill="#FFD400"/>
  </g>
</svg>
